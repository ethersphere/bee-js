name: Promote stable release to master

# Moves `master` to the released commit. --force-with-lease covers master drifting
# from upcoming (master has no independent history worth protecting by design).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  promote:
    # skip prereleases / any tag containing a `-` suffix (e.g. -upcoming, -rc)
    if: ${{ github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
          token: ${{ secrets.REPO_GHA_PAT }}

      - name: Move master to ${{ github.event.release.tag_name }}
        run: git push origin HEAD:refs/heads/master --force-with-lease
